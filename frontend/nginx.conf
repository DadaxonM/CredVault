# Brute-force himoyasi (ikkinchi qatlam): login endpointiga IP bo'yicha so'rov cheklovi.
# slowapi (ilova darajasida) asosiy aniq cheklov; bu esa nginx darajasida haddan
# tashqari floodni backendga yetib bormasdan ushlaydi.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5m;

    # Login endpointi uchun alohida (qat'iyroq) cheklov
    location = /api/auth/login {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://backend:8000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend konteynerga proksi (docker-compose service nomi orqali)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router uchun SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assetlarni keshlash
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
